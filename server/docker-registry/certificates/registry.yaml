---
apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: registry-home-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: registry-home
  namespace: kube-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`registry.home`)
      kind: Rule
      services:
        - name: docker-registry-svc
          port: 5000
  tls:
    secretName: registry-home-tls
---
apiVersion: v1
kind: Service
metadata:
  name: docker-registry-svc
  namespace: kube-system
  labels:
    app: docker-registry
    version: v2
  annotations:
    description: "Docker Registry service - self-signed TLS"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: docker-registry-svc
  namespace: kube-system
subsets:
  - addresses:
      - ip: 192.168.1.14
    ports:
      - name: http
        port: 5000
